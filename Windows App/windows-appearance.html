<dialog id="appearance-dialog" aria-labelledby="appearance-title">
  <div class="dialog-top">
    <h2 id="appearance-title">Appearance</h2>
    <button class="dialog-close" id="close-appearance" aria-label="Close appearance">×</button>
  </div>
  <div class="dialog-content windows-settings">
    <div id="windows-theme-settings"></div>
    <div class="windows-setting">
      <label for="app-icon-choice">App icon</label>
      <select id="app-icon-choice"><option value="multicolor">Multicolor</option><option value="classic">Classic</option><option value="2006">2006</option></select>
    </div>
    <div class="windows-setting">
      <label for="windows-layout">Show list</label>
      <select id="windows-layout"><option value="cards">Cards</option><option value="columns">Resizable columns</option></select>
    </div>
    <div class="windows-setting">
      <label for="windows-zoom">Zoom</label>
      <select id="windows-zoom"><option>75%</option><option>85%</option><option>100%</option><option>115%</option><option>125%</option><option>150%</option><option>175%</option><option>200%</option></select>
    </div>
  </div>
</dialog>
